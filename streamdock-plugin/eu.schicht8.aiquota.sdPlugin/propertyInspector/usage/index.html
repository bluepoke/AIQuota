<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>AIQuota - property inspector</title>
    <link rel="stylesheet" href="../../static/css/sdpi.css">
    <style>
        #flashThreshold:disabled { opacity: 0.5; }
    </style>
</head>

<body>
    <div class="sdpi-wrapper" style="display: none">
        <div class="sdpi-item">
            <div class="sdpi-item-label">Display</div>
            <select class="sdpi-item-value select" id="style">
                <option value="combined">Combined (all bars + countdown ring)</option>
                <option value="session">5h session (with countdown)</option>
                <option value="week">Week</option>
                <option value="credit">Credit</option>
            </select>
        </div>
        <div class="sdpi-item" type="checkbox">
            <div class="sdpi-item-label">Flash</div>
            <div class="sdpi-item-value">
                <input id="flashEnabled" type="checkbox" checked>
                <label for="flashEnabled"><span></span>Flash when usage reaches threshold</label>
            </div>
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">Flash threshold (%)</div>
            <input class="sdpi-item-value" id="flashThreshold" type="number" min="1" max="100" step="1" value="90">
        </div>
    </div>
    <script src="../utils/common.js"></script>
    <script src="../utils/action.js"></script>
    <script src="index.js"></script>
</body>

</html>
